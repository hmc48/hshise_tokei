<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設基準届出状況</title>
    <style>
        /* シックで清潔感のあるデザイン */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --border-color: #dcdde1;
            --text-muted: #7f8c8d;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .control-panel {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-bottom: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: bold;
            white-space: nowrap;
        }

        select, input[type="text"] {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
        }

        select {
            min-width: 150px;
        }

        input[type="text"] {
            min-width: 300px;
        }

        /* 案内メッセージのスタイル */
        .info-msg {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
            padding-left: 5px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #fff;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            background-color: #f2f4f7;
            font-weight: bold;
        }

        td:first-child, th:first-child {
            text-align: left;
            background-color: #fdfdfd;
            min-width: 250px;
        }

        tr:hover td {
            background-color: #f1f7ff;
        }

        .num-cell {
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 500;
        }

        .empty-cell {
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>施設基準 医療機関種類別届出状況（2026/3/1)</h2>

    <div class="control-panel">
        <div class="input-row">
            <div class="control-group">
                <label for="prefSelect">都道府県選択:</label>
                <select id="prefSelect"></select>
            </div>
            
            <div class="control-group">
                <label for="searchInput">届出名称検索:</label>
                <input type="text" id="searchInput" autocomplete="off" placeholder="名称の一部を入力（例：外来）">
            </div>
        </div>
        <p class="info-msg">※ブラウザによりパスワードと表示されても、検索に支障はありません。</p>
    </div>

    <div class="table-wrapper">
        <table id="resultTable">
            <thead>
                <tr id="headerRow">
                    <th>届出名称</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
/**
 * グローバル変数でデータを保持
 */
let rawData = [];

const targetTypes = [
    "1:特定機能病院",
    "2:地域医療支援病院",
    "3:病院",
    "4:診療所"
];

/**
 * 初期化処理
 */
async function init() {
    try {
        const response = await fetch('shise.json');
        if (!response.ok) {
            throw new Error('JSONファイルの読み込みに失敗しました。');
        }
        rawData = await response.json();

        const prefSelect = document.getElementById('prefSelect');
        const searchInput = document.getElementById('searchInput');
        
        const prefs = [...new Set(rawData.map(item => item.都道府県名))];
        
        prefs.forEach(pref => {
            const option = document.createElement('option');
            option.value = pref;
            option.textContent = pref;
            prefSelect.appendChild(option);
        });

        const headerRow = document.getElementById('headerRow');
        targetTypes.forEach(type => {
            const th = document.createElement('th');
            th.textContent = type;
            headerRow.appendChild(th);
        });

        prefSelect.addEventListener('change', renderTable);
        searchInput.addEventListener('input', renderTable);
        
        renderTable();
    } catch (error) {
        console.error('エラー:', error);
        alert('データの読み込み中にエラーが発生しました。');
    }
}

/**
 * テーブルの描画
 */
function renderTable() {
    const selectedPref = document.getElementById('prefSelect').value;
    const searchQuery = document.getElementById('searchInput').value.trim();
    const tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '';

    if (!selectedPref) return;

    const filteredByPref = rawData.filter(item => item.都道府県名 === selectedPref);

    const pivotData = {};
    const rowNames = new Set();

    filteredByPref.forEach(item => {
        const rowName = item.受理届出名称;
        const typeName = item.医療機関種別;
        const count = item.算定医療機関数;

        if (searchQuery && !rowName.includes(searchQuery)) {
            return;
        }

        if (!pivotData[rowName]) {
            pivotData[rowName] = {};
        }
        pivotData[rowName][typeName] = count;
        rowNames.add(rowName);
    });

    Array.from(rowNames).sort().forEach(rowName => {
        const tr = document.createElement('tr');
        
        const nameTd = document.createElement('td');
        nameTd.textContent = rowName;
        tr.appendChild(nameTd);

        targetTypes.forEach(type => {
            const valTd = document.createElement('td');
            valTd.className = 'num-cell';
            const val = pivotData[rowName][type];
            
            if (val !== undefined) {
                valTd.textContent = val.toLocaleString();
            } else {
                valTd.textContent = '-';
                valTd.classList.add('empty-cell');
            }
            tr.appendChild(valTd);
        });

        tableBody.appendChild(tr);
    });
}

window.onload = init;
</script>

</body>
</html>
